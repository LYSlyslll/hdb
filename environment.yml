name: hdb-cluster-env
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  - python=3.10
  - numpy=1.24.4
  - scikit-learn=1.3.2
  - hdbscan=0.8.33
  - umap-learn=0.5.3
  - pytorch=2.1.2
  - torchvision=0.16.2
  - torchaudio=2.1.2
  - cpuonly
  - transformers=4.38.1
  - pip=23.3.1
  - pip:
      - vllm==0.4.2
